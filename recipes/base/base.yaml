version: 1
name: base

profiles:
  debian:
    packages:
      - sudo
      - curl
      - wget
      - git
      - ca-certificates
      - nano
      - vim-tiny
      - htop
      - pciutils
      - usbutils
      - bzip2
      - xz-utils
      - systemd-timesyncd
    files:
      - path: /etc/profile.d/00-tailor-base.sh
        content: |
          alias ll='ls -la --color=auto'
          alias l='ls -CF --color=auto'
          export EDITOR=nano
      - path: /etc/sysctl.d/99-tailor-base.conf
        content: |
          fs.inotify.max_user_watches=524288
      - path: /etc/sudoers.d/99-tailor-wheel
        content: |
          %sudo ALL=(ALL:ALL) ALL
    services:
      - systemd-timesyncd.service

  archlinux:
    packages:
      - sudo
