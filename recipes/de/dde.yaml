version: 1
name: dde-desktop
description: Deepin Desktop Environment (DDE) with elegant and intuitive interface

profiles:
  debian:
    packages:
      - xserver-xorg
      - dde-desktop
      - dde-session-ui
      - dde-control-center
      - deepin-terminal
      - deepin-icon-theme
      - deepin-sound-theme
      - deepin-notifications
      - fonts-dejavu-core
      # firefox-esr
      - spice-vdagent
      - xdg-user-dirs
      - xdg-user-dirs-gtk
    files:
      - path: /etc/lightdm/lightdm.conf.d/50-chef.conf
        content: |
          [Seat:*]
          greeter-session=lightdm-gtk-greeter
          user-session=deepin

  archlinux:
    packages:
      - xorg-server
      - deepin
      - deepin-extra
      - deepin-terminal
      - ttf-dejavu
      - firefox
      - spice-vdagent
      - xdg-user-dirs
      - xdg-user-dirs-gtk
    files:
      - path: /etc/lightdm/lightdm.conf.d/50-chef.conf
        content: |
          [Seat:*]
          greeter-session=lightdm-gtk-greeter
          user-session=deepin

  fedora:
    packages:
      - xorg-x11-server-Xorg
      - dde-desktop
      - dde-session-ui
      - dde-control-center
      - deepin-terminal
      - dejavu-sans-fonts
      - firefox
      - spice-vdagent
      - xdg-user-dirs
      - xdg-user-dirs-gtk
    files:
      - path: /etc/lightdm/lightdm.conf.d/50-chef.conf
        content: |
          [Seat:*]
          greeter-session=lightdm-gtk-greeter
          user-session=deepin

  opensuse:
    packages:
      - xorg-x11-server
      - patterns-deepin-deepin
      - deepin-terminal
      - pipewire
      - pipewire-pulseaudio
      - wireplumber
      - dejavu-fonts
      - MozillaFirefox
      - spice-vdagent
      - xdg-user-dirs
      - xdg-user-dirs-gtk
    files:
      - path: /etc/lightdm/lightdm.conf.d/50-chef.conf
        content: |
          [Seat:*]
          greeter-session=lightdm-gtk-greeter
          user-session=deepin
