version: 1
name: lightdm
description: LightDM lightweight display manager service and configuration

profiles:
  debian:
    packages:
      - lightdm
      - lightdm-gtk-greeter
    files:
      - path: /etc/lightdm/lightdm.conf.d/50-chef.conf
        content: |
          [Seat:*]
          greeter-session=lightdm-gtk-greeter
    default_target: graphical.target
    services:
      - lightdm.service

  archlinux:
    packages:
      - lightdm
      - lightdm-gtk-greeter
    files:
      - path: /etc/lightdm/lightdm.conf.d/50-chef.conf
        content: |
          [Seat:*]
          greeter-session=lightdm-gtk-greeter
    default_target: graphical.target
    services:
      - lightdm.service

  fedora:
    packages:
      - lightdm
      - lightdm-gtk
    files:
      - path: /etc/lightdm/lightdm.conf.d/50-chef.conf
        content: |
          [Seat:*]
          greeter-session=lightdm-gtk-greeter
    default_target: graphical.target
    services:
      - lightdm.service

  opensuse:
    packages:
      - lightdm
      - lightdm-gtk-greeter
    files:
      - path: /etc/lightdm/lightdm.conf.d/50-chef.conf
        content: |
          [Seat:*]
          greeter-session=lightdm-gtk-greeter
    default_target: graphical.target
    services:
      - lightdm.service
