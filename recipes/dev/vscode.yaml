version: 1
name: vscode

profiles:
  debian:
    repositories:
      - path: /etc/apt/sources.list.d/vscode.sources
        content: |
          Types: deb
          URIs: https://packages.microsoft.com/repos/code
          Suites: stable
          Components: main
          Signed-By: /etc/apt/keyrings/packages.microsoft.gpg
    packages:
      - code

  archlinux:
    packages:
      - code

  fedora:
    packages:
      - code

  opensuse:
    packages:
      - code
