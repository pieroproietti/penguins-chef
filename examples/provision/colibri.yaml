# Colibri desktop with reviewed public defaults and artwork.
# Networking, the audio stack, base and eggs-dev remain separate.
version: 1
name: colibri-desktop
sysroot: colibri/sysroot
profiles:
  debian:
    packages:
      - xserver-xorg
      - xfce4
      - xfce4-terminal
      - xfce4-whiskermenu-plugin
      - xfce4-pulseaudio-plugin
      - lightdm
      - lightdm-gtk-greeter
      - fonts-dejavu-core
      - firefox-esr
      - spice-vdagent
    files:
      - path: /etc/lightdm/lightdm.conf.d/50-tailor.conf
        content: |
          [Seat:*]
          greeter-session=lightdm-gtk-greeter
          user-session=xfce
    default_target: graphical.target
    services:
      - lightdm.service
  archlinux:
    packages:
      - xorg-server
      - xfce4-session
      - xfce4-panel
      - xfce4-settings
      - xfce4-terminal
      - xfce4-whiskermenu-plugin
      - xfce4-pulseaudio-plugin
      - xfdesktop
      - xfwm4
      - thunar
      - lightdm
      - lightdm-gtk-greeter
      - ttf-dejavu
      - firefox
      - spice-vdagent
    files:
      - path: /etc/lightdm/lightdm.conf.d/50-tailor.conf
        content: |
          [Seat:*]
          greeter-session=lightdm-gtk-greeter
          user-session=xfce
    default_target: graphical.target
    services:
      - lightdm.service
  fedora:
    packages:
      - xorg-x11-server-Xorg
      - xfce4-session
      - xfce4-panel
      - xfce4-settings
      - xfce4-terminal
      - xfce4-whiskermenu-plugin
      - xfce4-pulseaudio-plugin
      - xfdesktop
      - xfwm4
      - Thunar
      - lightdm
      - lightdm-gtk
      - dejavu-sans-fonts
      - firefox
      - spice-vdagent
    files:
      - path: /etc/lightdm/lightdm.conf.d/50-tailor.conf
        content: |
          [Seat:*]
          greeter-session=lightdm-gtk-greeter
          user-session=xfce
    default_target: graphical.target
    services:
      - lightdm.service
  opensuse:
    packages:
      - xorg-x11-server
      - xfce4-session
      - xfce4-panel
      - xfce4-settings
      - xfce4-terminal
      - xfce4-whiskermenu-plugin
      - xfce4-pulseaudio-plugin
      - xfdesktop
      - xfwm4
      - thunar
      - lightdm
      - lightdm-gtk-greeter
      - dejavu-fonts
      - MozillaFirefox
      - spice-vdagent
    files:
      - path: /etc/lightdm/lightdm.conf.d/50-tailor.conf
        content: |
          [Seat:*]
          greeter-session=lightdm-gtk-greeter
          user-session=xfce
    default_target: graphical.target
    services:
      - lightdm.service
